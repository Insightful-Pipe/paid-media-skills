name: Sync skills from insightfulpipe.com

on:
  schedule:
    - cron: '55 2,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-plugin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild the plugin from the published skills
        run: python3 scripts/sync_plugin.py insightfulpipe-paid-media
      - name: Commit any changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Sync skills from insightfulpipe.com"
            git push
          else
            echo "Nothing to commit."
          fi
